[db]
db ansible_host="{{ db_node_ip }}" ansible_password="{{ db_ssh_password }}" ansible_become_password="{{ db_ssh_password }}"


[lb]
lb01 ansible_host=192.168.56.14 ansible_password="{{ lb01_ssh_password }}" ansible_become_password="{{ lb01_ssh_password }}"


[app]
app01 ansible_host="{{ app01_node_ip }}" ansible_password="{{ app01_ssh_password }}" ansible_become_password="{{ app01_ssh_password }}"
#app02 ansible_host=192.168.56.12 ansible_password="{{ app02_ssh_password }}" ansible_become_password="{{ app02_ssh_password }}"


[all:vars]
ansible_connection=ssh
ansible_user=vagrant
ansible_become=true
ansible_ssh_common_args='-o StrictHostKeyChecking=no'