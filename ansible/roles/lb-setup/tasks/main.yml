---
- name: Install Nginx
  package:
    name: nginx 
    state: present


- name: Let SELinux allow ngnix server to make outbound request
  seboolean:
    name: httpd_can_network_connect
    state: true 
    persistent: true 


- name: Take backup of nginx config file 
  copy:
    src: /etc/nginx/nginx.conf 
    dest: /etc/nginx/nginx.conf_bak
    remote_src: true
    mode: '0644'


- name: Deploy ngnix config from templates
  templates: 
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    mode: '0644'
  notify: reload nginx


- name: Validate nginx config 
  command: nginx -t
  changed_when: false 


- name: Start and enable nginx service
  systemd:
    name: nginx 
    state: started
    enabled: true 


